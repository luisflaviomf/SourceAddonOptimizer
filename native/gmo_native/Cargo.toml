[package]
name = "gmo_native"
version = "0.1.0"
edition = "2021"
description = "Native hot paths of the GMod Addon Optimizer worker (C ABI, loaded with ctypes)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
